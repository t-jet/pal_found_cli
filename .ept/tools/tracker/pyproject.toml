[project]
name = "tracker-cli"
version = "0.1.0"
description = "File-based ticket tracking CLI"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
tracker = "tracker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["tracker"]

[tool.coverage.report]
show_missing = true
