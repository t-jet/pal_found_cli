type: design
id_prefix: DESIGN
description: >-
  Design sub-task under a Developer Story: grooming, estimation, and technical design activities.
required_fields: [id, type, title, status, parent, created, updated]
optional_fields: [priority, resolution, assignee, reporter, component, labels,
                  estimated_hours, time_spent_hours, due_date]
initial_status: New
terminal_statuses: [Closed, Canceled, Rejected, Duplicated]
statuses:
  New:
    description: "Created; triage and prerequisites validation."
    stage_goal: "Triage the sub-task, validate readiness, and move to Open."
    responsible_roles:
      - Creator (Assignee)
  Open:
    description: "Prerequisites validated; ready to start work."
    stage_goal: "Prepare for work once prerequisites are met."
    responsible_roles:
      - Assignee
  In Progress:
    description: "Design work in progress; grooming and technical specification being produced."
    stage_goal: "Execute design and grooming activities and record progress."
    responsible_roles:
      - Assignee
  Blocked:
    description: "Cannot proceed; blocker documented."
    stage_goal: "Verify blocking condition remains, maintain blocker links and priorities, and return to prior status when unblocked."
    responsible_roles:
      - Current assignee
  Resolved:
    description: "Design work complete; ready for review."
    stage_goal: "Manage blockers and prepare for closure."
    responsible_roles:
      - Assignee
  Closed:
    description: "Verified and archived."
    stage_goal: "Archive the completed sub-task."
    responsible_roles:
      - Assignee
  Canceled:
    description: "Sub-task canceled before completion."
    stage_goal: "Record cancellation rationale and archive."
    responsible_roles:
      - Assignee
      - Reporter
  Rejected:
    description: "Sub-task rejected as invalid or out of scope."
    stage_goal: "Record rejection reason and archive."
    responsible_roles:
      - Assignee
      - Reporter
  Duplicated:
    description: "Sub-task is a duplicate of another ticket."
    stage_goal: "Link to original ticket and archive."
    responsible_roles:
      - Assignee
      - Reporter
allowed_transitions:
  New:         [Open, Canceled, Rejected, Duplicated]
  Open:        [In Progress, Blocked, Canceled, Rejected, Duplicated]
  In Progress: [Resolved, Blocked, Canceled, Rejected, Duplicated]
  Blocked:     [Open, In Progress, Canceled, Rejected, Duplicated]
  Resolved:    [Closed, Canceled, Rejected, Duplicated]
  Closed:      []
  Canceled:    []
  Rejected:    []
  Duplicated:  []
automatic_transitions:
  # AT-4: block when a Question sub-task with a Blocks link is created
  - rule: child_blocker_created
    child_filter:
      types: [question]
      link_type: Blocks
    target_status: Blocked

  # AT-5: restore prior status when all blockers are cleared
  - rule: all_blockers_cleared
    blocker_terminal_statuses: [Closed, Done, Canceled, Rejected, Duplicated]
    source_status: Blocked
    target_status: prior_status

ticket_instructions:
  New:
    instructions:
      - Set assignee to ticket creator.
      - Review related documentation and parent Story context.
      - Apply critical thinking and ask questions.
      - "IF you need to clarify any question with other team members listed in the `.ept/docs/resources/available_resources.md` THEN create a QUESTION sub-task addressed to the appropriate role, add a Blocks link and a Question link from it to this ticket, set status to Blocked until resolved, and record blocker ID and prior status as a comment on this ticket."
      - "Review answers from linked QUESTION tickets: Query Question links on this ticket. For each linked QUESTION ticket found: retrieve it, read its Answer section and comments, and incorporate findings/decisions into current work."
      - Identify blockers and add a blocking link.
      - Move to Open.
    transition_dods:
      - target_statuses: [Open]
        dod_criteria:
          - "Studied related documentation from the `.ept/docs/document_index.md`"
          - Critical thinking applied
          - All required questions asked and answered
          - Assignee set to creator
          - Parent Story context reviewed
          - Blockers identified and recorded (links or question)
          - "Required fields validated (status, assignee, priority, dates)"

  Open:
    instructions:
      - "IF ticket missing THEN create DESIGN-XXX under DEV-STORY-XXX."
      - Set required fields for the new sub-task.
      - Add required links to parent Story.
      - Apply critical thinking and ask questions.
      - "IF you need to clarify any question with other team members listed in the `.ept/docs/resources/available_resources.md` THEN create a QUESTION sub-task addressed to the appropriate role, add a Blocks link and a Question link from it to this ticket, set status to Blocked until resolved, and record blocker ID and prior status as a comment on this ticket."
      - "Review answers from linked QUESTION tickets: Query Question links on this ticket. For each linked QUESTION ticket found: retrieve it, read its Answer section and comments, and incorporate findings/decisions into current work."
      - Create a plan as a comment on this ticket.
      - IF scope too large THEN split into additional DESIGN sub-tasks.
      - IF design docs exist THEN link as a comment on this ticket.
    transition_dods:
      - target_statuses: [In Progress]
        dod_criteria:
          - "Studied related documentation from the `.ept/docs/document_index.md`"
          - Critical thinking applied
          - All required questions asked and answered
          - Acceptance criteria prepared
          - Developer Story in Grooming
          - Design plan created as a comment on this ticket
          - Related documentation linked as a comment on this ticket (when exists)
          - List of deliverables defined in the Acceptance Criteria

  "In Progress":
    instructions:
      - Analyze requirements and work done in the BA-SUB, SA-SUB and UX-SUB sub-tasks.
      - "Identify best available resources for implementation; if there are no matches, create a new RESOURCE-REQ ticket to get new resource, add a blocking link, set status to Blocked until resolved, and record blocker ID and prior status as a comment on this ticket."
      - Produce design notes and estimates as a comment on this ticket.
    transition_dods:
      - target_statuses: [Resolved]
        dod_criteria:
          - "Studied related documentation from the `.ept/docs/document_index.md`"
          - Critical thinking applied
          - All required questions asked and answered
          - All required resources available
          - All required deliverables completed
          - "Related documents in the `.ept/docs/document_index.md` analyzed and modified to incorporate ticket results"
          - "`.ept/docs/document_index.md` updated for changes in deliverables"
          - All document changes documented as a comment on this ticket
          - "ALL sub-tasks created for parent Story with proper responsible persons identified from `.ept/docs/resources/available_resources.md`"
          - Review sub-task assigned to different responsible person (not implementer)
          - Implementation approach documented
          - "Estimates completed (story points + hours for each sub-task)"
          - Design notes recorded
          - Time reported in subtask frontmatter
          - All links registered

  Resolved:
    instructions:
      - IF blocker link exists AND blocker resolved THEN remove the blocking link.
      - Confirm completeness and handoff.
      - IF not blocked AND doesn't block others THEN ready to move to Closed.
    transition_dods:
      - target_statuses: [Closed]
        dod_criteria:
          - Ticket not blocked (no active is-blocked-by links)

  Closed:
    instructions:
      - Terminal status, Archive only; no edits.
    transition_dods: []

  Blocked:
    instructions:
      - Confirm blocker and prior status are documented as a comment on this ticket (include blocker ID and prior status).
      - Verify blocking link exists on this ticket.
      - Do not create new blocker links in this status; they must be created when the block is identified.
      - "IF blocking link missing THEN create QUESTION-XXX addressed_to appropriate role, add a Blocks link from the question to this ticket, and remain Blocked."
      - "Query blocking links on this ticket. For each blocker found: IF blocker status IN `Closed`, `Done`, `Canceled`, `Rejected`, `Duplicated` THEN remove the blocking link and return to prior status; IF blocker still active AND blocker priority lower than this ticket priority THEN raise blocker priority to match."
      - IF all blocking links removed THEN return to prior status documented in comments.
    transition_dods: []
