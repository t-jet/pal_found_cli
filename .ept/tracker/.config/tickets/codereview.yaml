type: codereview
id_prefix: CODEREVIEW
description: >
  Code review sub-task linked to a Development sub-task. Assigned to reviewer
  (not implementer). Activated when DEV sub-task reaches Resolved.
required_fields: [id, type, title, status, parent, created, updated]
optional_fields: [priority, resolution, assignee, reporter, estimated_hours, time_spent_hours, due_date]
initial_status: New
terminal_statuses: [Closed, Canceled, Rejected, Duplicated]
statuses:
  New:
    description: "Waiting for linked Development sub-task to reach Resolved."
    stage_goal: "Create and prepare the review task and keep it blocked until development is ready."
    responsible_roles:
      - Story Owner
      - Reviewer (Architect/Business Analyst)
  Open:
    description: "Review in progress by reviewer."
    stage_goal: "Perform the review and decide whether corrections are needed or approval can be granted."
    responsible_roles:
      - Reviewer (Architect/Business Analyst)
  Correction:
    description: "Corrections requested; assigned back to implementer."
    stage_goal: "Apply corrective actions requested by the reviewer."
    responsible_roles:
      - Implementer (Developer/UX Designer)
  Corrected:
    description: "Corrections applied; back to reviewer."
    stage_goal: "Re-review corrections and decide on further changes or approval."
    responsible_roles:
      - Reviewer (Architect/Business Analyst)
  Blocked:
    description: "Cannot proceed; blocker documented."
    stage_goal: "Verify blocking condition remains, maintain blocker links and priorities, and return to prior status when unblocked."
    responsible_roles:
      - Current assignee
  Closed:
    description: "Review approved and finalized."
    stage_goal: "Finalize approval, return development to prior status, and archive the review."
    responsible_roles:
      - Reviewer
      - Implementer
  Canceled:
    description: "Code review canceled before completion."
    stage_goal: "Record cancellation rationale and archive."
    responsible_roles:
      - Story Owner
      - Reviewer
  Rejected:
    description: "Code review rejected; implementation requires major rework."
    stage_goal: "Record rejection reason and archive."
    responsible_roles:
      - Reviewer (Architect/Business Analyst)
  Duplicated:
    description: "Code review is a duplicate of another ticket."
    stage_goal: "Link to original ticket and archive."
    responsible_roles:
      - Story Owner
      - Reviewer
allowed_transitions:
  New:        [Open, Blocked, Canceled, Rejected, Duplicated]
  Open:       [Correction, Closed, Blocked, Canceled, Rejected, Duplicated]
  Correction: [Corrected, Blocked, Canceled, Rejected, Duplicated]
  Corrected:  [Correction, Closed, Blocked, Canceled, Rejected, Duplicated]
  Blocked:    [Open, Correction, Corrected, Canceled, Rejected, Duplicated]
  Closed:     []
  Canceled:   []
  Rejected:   []
  Duplicated: []
automatic_transitions:
  # AT-3: activate this CodeReview when its linked Development sub-task resolves
  - rule: linked_ticket_reaches_status
    link_type: RelatesTo
    link_role: source
    linked_ticket_types: [development]
    linked_statuses: [Resolved]
    source_status: New
    target_status: Open

  # AT-4: block when a Question sub-task with a Blocks link is created
  - rule: child_blocker_created
    child_filter:
      types: [question]
      link_type: Blocks
    target_status: Blocked

  # AT-5: restore prior status when all blockers are cleared
  - rule: all_blockers_cleared
    blocker_terminal_statuses: [Closed, Done, Canceled, Rejected, Duplicated]
    source_status: Blocked
    target_status: prior_status

ticket_instructions:
  New:
    instructions:
      - Set assignee to ticket creator.
      - Review related Development sub-task and parent Story context.
      - Apply critical thinking and ask questions.
      - "IF you need to clarify any question with other team members listed in the `.ept/docs/resources/available_resources.md` THEN create a QUESTION sub-task addressed to the appropriate role, add a Blocks link and a Question link from it to this ticket, set status to Blocked until resolved, and record blocker ID and prior status as a comment on this ticket."
      - "Review answers from linked QUESTION tickets: Query Question links on this ticket. For each linked QUESTION ticket found: retrieve it, read its Answer section and comments, and incorporate findings/decisions into current work."
      - Identify blockers and add a blocking link.
      - "IF ticket missing THEN create CODEREVIEW-XXX under DEV-STORY-XXX."
      - Set required fields for the new sub-task.
      - "Add relates-to links: source_ticket=this CODEREVIEW, target_ticket=related DEV sub-task, link_type=RelatesTo; source_ticket=this CODEREVIEW, target_ticket=parent Story, link_type=RelatesTo."
      - Set status to New and Blocked by Development sub-task until Development is Resolved.
      - "CORRECTIVE ACTION IF IMPLEMENTATION DOES NOT EXIST: IF implementation files do not exist THEN do NOT start code review; IF DEV-XXX marked Resolved but files missing THEN create BUG ticket for phantom implementation; IF code does not compile THEN do NOT proceed with review - return to DEV-XXX for fixes."
      - Move to Open when DoD is met.
    transition_dods:
      - target_statuses: [Open]
        dod_criteria:
          - "Studied related documentation from the `.ept/docs/document_index.md`"
          - Critical thinking applied
          - All required questions asked and answered
          - "Assignee set to reviewer (Lead Developer/Architect/Business Analyst/..., NOT reviewed ticket implementer)"
          - "Reviewer assignment follows policy (Architect/Lead Developer for dev work; BA + Architect for UX/UI)"
          - Related Development sub-task identified and linked
          - Parent Story context reviewed
          - Blockers identified and recorded (links or question)
          - "Required fields validated (status, assignee, priority, dates)"
          - "MANDATORY PRE-REVIEW VERIFICATION: Implementation files physically exist in workspace"
          - "MANDATORY PRE-REVIEW VERIFICATION: Code compiles without errors"

  Open:
    instructions:
      - Review code/design and log findings as a comment on this ticket.
      - Apply critical thinking.
      - "IF you need to clarify any question with other team members listed in the `.ept/docs/resources/available_resources.md` THEN create a QUESTION sub-task addressed to the appropriate role, add a Blocks link and a Question link from it to this ticket, set status to Blocked until resolved, and record blocker ID and prior status as a comment on this ticket."
      - "Review answers from linked QUESTION tickets: Query Question links on this ticket. For each linked QUESTION ticket found: retrieve it, read its Answer section and comments, and incorporate findings/decisions into current work."
      - IF review requires changes THEN move to Correction and assign to implementer.
      - IF review approved THEN move to Closed and return Development sub-task to its prior status.
      - "CORRECTIVE ACTION FOR PHANTOM REVIEWS: IF review findings don't cite specific files/lines THEN review is incomplete; IF review claims excellence but provides no code examples THEN review may be phantom; IF files reviewed do not exist THEN this is phantom review - create BUG ticket and revert to New; ALL review findings MUST reference verifiable code locations."
    transition_dods:
      - target_statuses: [Correction, Closed]
        dod_criteria:
          - "Studied related documentation from the `.ept/docs/document_index.md`"
          - Critical thinking applied
          - All required questions asked and answered
          - Code/design reviewed thoroughly
          - "MANDATORY: Specific file paths and line numbers cited in review findings"
          - "MANDATORY: Review findings reference actual code snippets (not generic descriptions)"
          - Review findings documented as a comment on this ticket
          - "Decision made (approve or request corrections)"

  Correction:
    instructions:
      - Assignee is the implementer of the Development sub-task.
      - Apply critical thinking.
      - "IF you need to clarify any question with other team members listed in the `.ept/docs/resources/available_resources.md` THEN create a QUESTION sub-task addressed to the appropriate role, add a Blocks link and a Question link from it to this ticket, set status to Blocked until resolved, and record blocker ID and prior status as a comment on this ticket."
      - "Review answers from linked QUESTION tickets: Query Question links on this ticket. For each linked QUESTION ticket found: retrieve it, read its Answer section and comments, and incorporate findings/decisions into current work."
      - Implement corrective actions in the Development sub-task.
      - Add comment summarizing fixes and responses.
      - THEN move to Corrected and reassign to original reviewer.
    transition_dods:
      - target_statuses: [Corrected]
        dod_criteria:
          - "Studied related documentation from the `.ept/docs/document_index.md`"
          - Critical thinking applied
          - All required questions asked and answered
          - All requested corrections implemented
          - Corrective actions documented as a comment on this ticket
          - Code/design updated

  Corrected:
    instructions:
      - Reviewer re-checks implementation.
      - IF further changes needed THEN move back to Correction and assign implementer.
      - IF satisfied THEN remove the blocking link to unblock Development sub-task and move to Closed.
    transition_dods:
      - target_statuses: [Correction, Closed]
        dod_criteria:
          - "Studied related documentation from the `.ept/docs/document_index.md`"
          - Critical thinking applied
          - All required questions asked and answered
          - Corrections re-reviewed
          - Re-review findings documented as a comment on this ticket
          - "Decision made (approve or request more corrections)"
      - target_statuses: [Closed]
        dod_criteria:
          - Review completed and approved by reviewer
          - "All review comments addressed or follow-up tasks created"
          - Code/design meets quality standards
          - All links registered

  Closed:
    instructions:
      - Terminal status, Archive only; no edits.
    transition_dods: []

  Blocked:
    instructions:
      - Confirm blocker and prior status are documented as a comment on this ticket (include blocker ID and prior status).
      - Verify blocking link exists on this ticket.
      - Do not create new blocker links in this status; they must be created when the block is identified.
      - "IF blocking link missing THEN create QUESTION-XXX addressed_to appropriate role, add a Blocks link from the question to this ticket, and remain Blocked."
      - "Query blocking links on this ticket. For each blocker found: IF blocker status IN `Closed`, `Done`, `Canceled`, `Rejected`, `Duplicated` THEN remove the blocking link and return to prior status; IF blocker still active AND blocker priority lower than this ticket priority THEN raise blocker priority to match."
      - IF all blocking links removed THEN return to prior status documented in comments.
    transition_dods: []
